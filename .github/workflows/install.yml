name: Install Volatility3 test
# Upstream Volatility 3 checks: only run when the framework changes,
# not on GUI or docs changes. Run by hand from the Actions tab.
on:
  push:
    paths:
      - "volatility3/**"
      - "test/**"
      - "vol.py"
      - "volshell.py"
      - "pyproject.toml"
      - ".github/workflows/install.yml"
  pull_request:
    paths:
      - "volatility3/**"
      - "test/**"
      - "vol.py"
      - "volshell.py"
      - "pyproject.toml"
      - ".github/workflows/install.yml"
  workflow_dispatch:
jobs:

  install_test:
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13" ]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup python-pip
      run: python -m pip install --upgrade pip

    - name: Install volatility3
      run: pip install .

    - name: Run volatility3
      run: vol --help
