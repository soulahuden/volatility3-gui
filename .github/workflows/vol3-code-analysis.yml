name: Volatility3 Code Analysis
# Upstream Volatility 3 checks: only run when the framework changes,
# not on GUI or docs changes. Run by hand from the Actions tab.
on:
  push:
    paths:
      - "volatility3/**"
      - "test/**"
      - "vol.py"
      - "volshell.py"
      - "pyproject.toml"
      - ".github/workflows/vol3-code-analysis.yml"
  pull_request:
    paths:
      - "volatility3/**"
      - "test/**"
      - "vol.py"
      - "volshell.py"
      - "pyproject.toml"
      - ".github/workflows/vol3-code-analysis.yml"
  workflow_dispatch:
jobs:

  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.8"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[test]

    - name: Testing...
      run: |
        python ./test/volatility3_code_analysis.py
